<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Dazzle ERP</title>
    
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

    <script>
      // 1. Environment Simulation
      window.process = { env: { API_KEY: "" } };

      // 2. The Omniscient Module Linker
      const moduleRegistry = new Map();

      function resolvePath(base, relative) {
        if (!relative.startsWith('.')) return relative;
        const baseParts = base.split("/");
        baseParts.pop(); // Remove filename
        const relParts = relative.split("/");
        for (const part of relParts) {
          if (part === ".") continue;
          if (part === "..") baseParts.pop();
          else baseParts.push(part);
        }
        return baseParts.join("/");
      }

      async function fetchModule(url) {
        const extensions = ['', '.tsx', '.ts', '.js'];
        for (const ext of extensions) {
          try {
            const fullUrl = url + ext;
            const res = await fetch(fullUrl);
            if (res.ok) return { code: await res.text(), finalUrl: fullUrl };
          } catch (e) {}
        }
        throw new Error(`Module not found: ${url}`);
      }

      async function dazzleImport(url) {
        const normalizedUrl = url.startsWith('./') ? url : './' + url.replace(/^\//, '');
        if (moduleRegistry.has(normalizedUrl)) return moduleRegistry.get(normalizedUrl);

        const promise = (async () => {
          try {
            console.debug(`[System] Linking: ${normalizedUrl}`);
            const { code: originalCode, finalUrl } = await fetchModule(normalizedUrl);
            let code = originalCode;

            // Extract relative imports
            const importRegex = /(import|export)\s+([\s\S]*?from\s+)?['"](\.{1,2}\/.*?)['"]/g;
            const imports = [...code.matchAll(importRegex)];
            
            // Process each import in sequence to avoid double-replacement bugs
            for (const match of imports) {
              const fullMatch = match[0];
              const relativePath = match[3];
              const absolutePath = resolvePath(finalUrl, relativePath);
              
              const blobUrl = await dazzleImport(absolutePath);
              // Replace only the specific relative path instance within the match
              const updatedImport = fullMatch.replace(relativePath, blobUrl);
              code = code.replace(fullMatch, updatedImport);
            }

            const transformed = Babel.transform(code, {
              presets: ['react', ['typescript', { isTSX: true, allExtensions: true }]],
              filename: finalUrl
            }).code;

            const blob = new Blob([transformed], { type: 'application/javascript' });
            return URL.createObjectURL(blob);
          } catch (err) {
            console.error(`[System] Kernel error in ${normalizedUrl}:`, err);
            throw err;
          }
        })();

        moduleRegistry.set(normalizedUrl, promise);
        return promise;
      }

      window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 40px; color: #fff; background: #020617; min-height: 100vh; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center;">
              <div style="max-width: 600px; width: 100%; background: #991b1b; padding: 40px; border-radius: 16px; border: 2px solid #ef4444; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);">
                <h2 style="margin: 0 0 20px 0; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #fecaca; font-size: 24px;">Critical Kernel Failure</h2>
                <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.1); overflow-x: auto; color: #fecaca;">
                   <strong>Msg:</strong> ${message}<br/>
                   <strong>Source:</strong> ${source || 'Bootstrapper'}<br/>
                   <strong>Stack:</strong> ${error?.stack || 'No stack trace available'}
                </div>
                <button onclick="location.reload()" style="margin-top: 30px; width: 100%; padding: 16px; border: none; border-radius: 8px; background: white; color: #991b1b; font-weight: 900; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; font-size: 14px;">Reboot Engine</button>
              </div>
            </div>
          `;
        }
      };
    </script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; overflow: hidden; }
      @keyframes pulse-red { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
      .loading-pulse { animation: pulse-red 2s infinite; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="flex items-center justify-center min-h-screen bg-slate-950">
        <div class="text-center">
          <div class="loading-pulse mb-8">
            <div class="h-20 w-20 border-t-4 border-red-600 rounded-full animate-spin mx-auto"></div>
          </div>
          <h1 class="text-white font-black text-2xl tracking-[0.4em] uppercase mb-2">Auto Dazzle</h1>
          <p class="text-slate-500 font-bold text-[10px] uppercase tracking-[0.6em] mb-10">Modular ERP Engine v2.2.1</p>
          <div class="inline-flex items-center gap-3 px-6 py-2 bg-slate-900 rounded-full border border-slate-800">
             <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
             <p id="status-text" class="text-slate-400 text-[9px] uppercase font-black tracking-widest">Initializing Kernel...</p>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      async function boot() {
        const status = document.getElementById('status-text');
        try {
          if (status) status.innerText = "Linking System Modules...";
          const appBlobUrl = await dazzleImport('./App.tsx');
          
          if (status) status.innerText = "Launching Core...";
          await import(appBlobUrl);
        } catch (err) {
          console.error("Kernel boot failed:", err);
          window.onerror(err.message, "Boot", 0, 0, err);
        }
      }
      // Delay slightly to allow DOM to breathe
      setTimeout(boot, 50);
    </script>
  </body>
</html>
